name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The React dashboard (D43): its tests, then its bundle, which the site's build copies to dashboard/.
      - run: npm ci && npm test && npm run build
        working-directory: projects/react
      # The Angular dashboard (D44), likewise, copied to angular/.
      - run: npm ci && npm test && npm run build
        working-directory: projects/angular
      # Never publish a site whose tests fail, privacy scan included; the dashboard's link must resolve.
      - run: npm test
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          REQUIRE_DASHBOARD: 1
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
