name: lib-c

on:
  push:
    branches: [main]
    paths: ['projects/lib-c/**', 'src/assets/wasm/**', '.github/workflows/lib-c.yml']
  pull_request:
    paths: ['projects/lib-c/**', 'src/assets/wasm/**', '.github/workflows/lib-c.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lib-c-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/lib-c

jobs:
  test:
    name: C library (${{ matrix.os }}${{ matrix.sanitize == 'ON' && ', ASan + UBSan' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sanitize: ['OFF']
        include:
          - os: ubuntu-latest
            sanitize: 'ON'
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMESH_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  valgrind:
    name: C library (Valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: scripts/valgrind.sh build

  fuzz:
    name: C library (libFuzzer, 60 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: CC=clang cmake -S . -B fuzz -DMESH_FUZZ=ON -DMESH_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build fuzz --parallel
      - run: mkdir corpus && cp tests/data/* corpus/
      - run: fuzz/fuzz_read corpus -max_total_time=60 -max_len=4096 -timeout=5
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: projects/lib-c/crash-*

  wasm:
    name: C library (WebAssembly build is up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/build-wasm.sh "$RUNNER_TEMP/wasm"
      # The site serves the committed build: it must match what the sources produce today.
      - run: |
          cmp "$RUNNER_TEMP/wasm/meshlib.wasm" ../../src/assets/wasm/meshlib.wasm
          cmp "$RUNNER_TEMP/wasm/meshlib.js" ../../src/assets/wasm/meshlib.js
