name: ml

on:
  push:
    branches: [main]
    paths: ['projects/ml/**', '.github/workflows/ml.yml']
  pull_request:
    paths: ['projects/ml/**', '.github/workflows/ml.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/ml

jobs:
  test:
    name: ML (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q -W error

  pipeline:
    name: ML (DVC pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install ".[dvc]"
      - name: Rebuild the pipeline from scratch
        run: dvc repro --force
      # Same seed, same data: the hashes recorded in dvc.lock must not change.
      - run: git diff --exit-code dvc.lock
