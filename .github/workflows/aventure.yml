name: aventure

on:
  push:
    branches: [main]
    paths: ['projects/aventure/**', '.github/workflows/aventure.yml']
  pull_request:
    paths: ['projects/aventure/**', '.github/workflows/aventure.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aventure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Text adventure, Java 21 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: projects/aventure
        run: mvn -B verify
