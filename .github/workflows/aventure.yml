name: aventure

on:
  push:
    branches: [main]
    paths: ['projects/aventure/**', 'src/assets/wasm/aventure.js', '.github/workflows/aventure.yml']
  pull_request:
    paths: ['projects/aventure/**', 'src/assets/wasm/aventure.js', '.github/workflows/aventure.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aventure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Text adventure, Java 21 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: projects/aventure
        run: mvn -B verify

  web:
    name: Text adventure (TeaVM build is up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The site serves the committed JavaScript: it must match what the sources compile to today.
      - name: Compile to JavaScript and compare
        working-directory: projects/aventure
        run: |
          mvn -B -q -Pweb package -DskipTests
          cmp target/web/aventure.js ../../src/assets/wasm/aventure.js
