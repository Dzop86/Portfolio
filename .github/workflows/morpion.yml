name: morpion

on:
  push:
    branches: [main]
    paths: ['projects/morpion/**', '.github/workflows/morpion.yml']
  pull_request:
    paths: ['projects/morpion/**', '.github/workflows/morpion.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morpion-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/morpion

jobs:
  test:
    name: Tic-tac-toe, Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      # Includes every possible game against the AI, and the committed move book compared with a fresh one.
      - name: Unit tests (pytest)
        run: python -m pytest -q -W error
      - name: Types (mypy, strict)
        run: python -m mypy
      - name: A whole game
        shell: bash
        run: printf '5\n1\n3\n8\n6\n9\n' | morpion --seed 1
