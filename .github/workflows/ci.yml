name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  unit:
    name: Unit and integration (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}

  e2e:
    name: End-to-end (Playwright, desktop and mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The React dashboard (D43) is tested end to end with the site: built first, copied by the site's build.
      - run: npm ci && npm run build
        working-directory: projects/react
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t portfolio .
      - name: Smoke test
        run: |
          docker run -d --name portfolio -p 8080:80 portfolio
          for i in $(seq 1 10); do curl -fsS http://localhost:8080/fr/index.html >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/fr/index.html >/dev/null || { docker logs portfolio; exit 1; }
          # Unknown URLs get the site's own 404 page, with a 404 status.
          test "$(curl -s -o /tmp/404.html -w '%{http_code}' http://localhost:8080/fr/missing/page.html)" = 404
          grep -q '<base href="/">' /tmp/404.html
          # The dashboard and the API it reads (D43).
          curl -fsS http://localhost:8080/dashboard/ | grep -q 'id="root"'
          curl -fsS http://localhost:8080/api/v1/index.json | grep -q '"version": "v1"'
