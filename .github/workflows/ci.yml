name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  unit:
    name: Unit and integration (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}

  e2e:
    name: End-to-end (Playwright, desktop and mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio .
      - name: Smoke test
        run: |
          docker run -d --name portfolio -p 8080:80 portfolio
          for i in $(seq 1 10); do curl -fsS http://localhost:8080/fr/index.html >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/fr/index.html >/dev/null || { docker logs portfolio; exit 1; }
          # Unknown URLs get the site's own 404 page, with a 404 status.
          test "$(curl -s -o /tmp/404.html -w '%{http_code}' http://localhost:8080/fr/missing/page.html)" = 404
          grep -q '<base href="/">' /tmp/404.html
