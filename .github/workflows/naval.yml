name: naval

on:
  push:
    branches: [main]
    paths: ['projects/naval/**', '.github/workflows/naval.yml']
  pull_request:
    paths: ['projects/naval/**', '.github/workflows/naval.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Battleship, Java 21 + JavaFX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compiles with -Xlint:all -Werror, runs the model tests and the JavaFX tests headless (Monocle),
      # with the OpenJFX native libraries of each system.
      - name: Build and test
        working-directory: projects/naval
        run: mvn -B verify
