name: rogue

on:
  push:
    branches: [main]
    paths: ['projects/rogue/**', '.github/workflows/rogue.yml']
  pull_request:
    paths: ['projects/rogue/**', '.github/workflows/rogue.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rogue-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/rogue

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Roguelike, C# (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rogue/global.json
      - name: Format (dotnet format)
        run: dotnet format Rogue.slnx --verify-no-changes
      # Analyzers at the recommended level, warnings are errors (Directory.Build.props).
      - name: Build
        run: dotnet build Rogue.slnx -c Release
      # Includes the known runs: the same seed must give the same score on every system.
      # The API's tests need PostgreSQL: they run in the api job below.
      - name: Unit and integration tests (xUnit)
        run: |
          dotnet test --project tests/Rogue.Core.Tests -c Release --no-build
          dotnet test --project tests/Rogue.Cli.Tests -c Release --no-build
      - name: Replay the committed runs
        shell: bash
        run: |
          dotnet run --project src/Rogue.Cli -c Release --no-build -- --replay samples/escaped.json --lang en | tee "$RUNNER_TEMP/escaped.txt"
          grep -q "escaped from the dungeon, floor 5, 1496 turns, .* score 2071\." "$RUNNER_TEMP/escaped.txt"
          dotnet run --project src/Rogue.Cli -c Release --no-build -- --replay samples/died.json --lang en
      - name: A piped game, saved then replayed
        shell: bash
        run: |
          printf 'ddsssllkkjj.x' | dotnet run --project src/Rogue.Cli -c Release --no-build -- --seed 42 --save "$RUNNER_TEMP/run.json"
          dotnet run --project src/Rogue.Cli -c Release --no-build -- --replay "$RUNNER_TEMP/run.json"

  godot:
    name: Godot client, without a screen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rogue/global.json
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: false
      - name: Build the C# scripts
        run: dotnet build godot/Rogue.Godot.csproj
      - name: Import the project
        run: godot --headless --path godot --import
      # The client plays a whole run through the keyboard's code path, then checks it by replay.
      - name: A whole run in the client
        shell: bash
        timeout-minutes: 5
        run: |
          godot --headless --path godot -- --selftest --seed 9 --report "$RUNNER_TEMP/selftest.txt"
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q "SELFTEST OK seed 9: Escaped, floor 5, 1083 turns, score 1926" "$RUNNER_TEMP/selftest.txt"

  exports:
    name: Godot exports (Windows, Linux, macOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rogue/global.json
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true
      - run: godot --headless --path godot --import
      - name: Export the three desktop builds
        run: |
          mkdir -p godot/build/linux godot/build/windows godot/build/macos
          for preset in Linux Windows macOS; do
            godot --headless --path godot --export-release "$preset" 2>&1 | tee -a "$RUNNER_TEMP/export.log"
          done
          # Godot exits with 0 even when it could not export the C# part: check that it is there.
          if grep -q "ERROR" "$RUNNER_TEMP/export.log"; then exit 1; fi
          test -f godot/build/linux/data_Rogue.Godot_linuxbsd_x86_64/Rogue.Godot.dll
          test -f godot/build/windows/data_Rogue.Godot_windows_x86_64/Rogue.Godot.dll
          unzip -l godot/build/macos/rogue.zip | grep -q "data_Rogue.Godot_macos_arm64/Rogue.Godot.dll"
      - name: The exported Linux build plays a whole run
        timeout-minutes: 5
        run: |
          godot/build/linux/rogue.x86_64 --headless -- --selftest --seed 9 --report "$RUNNER_TEMP/selftest.txt"
          grep -q "SELFTEST OK seed 9: Escaped" "$RUNNER_TEMP/selftest.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: rogue-linux
          path: projects/rogue/godot/build/linux
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: rogue-windows
          path: projects/rogue/godot/build/windows
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: rogue-macos
          path: projects/rogue/godot/build/macos
          retention-days: 14

  api:
    name: Score API, ASP.NET Core and PostgreSQL
    runs-on: ubuntu-latest
    # GitHub's Windows and macOS runners cannot run Linux containers: the API is built on the three
    # systems above, and tested against PostgreSQL here.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # A throwaway database on the runner, reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      ROGUE_TEST_DB: Host=localhost;Username=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rogue/global.json
      # dotnet ef does not restore packages itself.
      - run: |
          dotnet tool restore
          dotnet restore Rogue.slnx
      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project src/Rogue.Api
      - name: Integration tests (WebApplicationFactory, real PostgreSQL)
        run: dotnet test --project tests/Rogue.Api.Tests -c Release

  docker:
    name: Score API (Docker image, compose, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rogue/global.json
      # The smoke test lets the terminal client's autopilot play the seed the server draws.
      - run: dotnet build src/Rogue.Cli -c Release
      - name: compose.yaml builds and serves the API and its database
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --build rogue-api
          for i in $(seq 1 60); do curl -fsS http://localhost:8001/health && break; sleep 1; done
      - name: End to end (sign up, draw a seed, play, submit, leaderboard, 413)
        run: ROGUE_CLI="dotnet run --project src/Rogue.Cli -c Release --no-build --" scripts/smoke.sh http://localhost:8001
      - name: API logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          docker compose logs rogue-api rogue-db
          docker compose down -v
