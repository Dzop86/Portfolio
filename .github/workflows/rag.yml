name: rag

on:
  push:
    branches: [main]
    paths: ['projects/rag/**', 'README.md', 'PLAN.md', 'DECISIONS.md', 'projects/*/README.md', 'projects/*/DECISIONS.md', '.github/workflows/rag.yml']
  pull_request:
    paths: ['projects/rag/**', 'README.md', 'PLAN.md', 'DECISIONS.md', 'projects/*/README.md', 'projects/*/DECISIONS.md', '.github/workflows/rag.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Documentation assistant (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Without the embedding model: the tests use a hashed bag of words and Qdrant in memory.
      - run: python -m pip install "./projects/rag[test]"
      - name: Test
        working-directory: projects/rag
        run: python -m pytest -q -W error

  retrieval:
    name: Retrieval on the reference questions (multilingual model)
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - run: python -m pip install "./projects/rag[embed]"
      - name: Evaluate the three searches
        working-directory: projects/rag
        run: |
          python -m docrag.evaluate --out "$RUNNER_TEMP/retrieval.json"
          # The hybrid search must keep finding a right passage in the first five for 3 questions in 4.
          python -c "import json,sys; r=json.load(open(sys.argv[1]))['retrieval']; print(r); assert r['hybrid']['recall@5'] >= 0.75, r" "$RUNNER_TEMP/retrieval.json"
      - uses: actions/upload-artifact@v7
        with:
          name: rag-retrieval
          path: ${{ runner.temp }}/retrieval.json
