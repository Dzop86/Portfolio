name: rpg

on:
  push:
    branches: [main]
    paths: ['projects/rpg/**', '.github/workflows/rpg.yml', 'compose.yaml']
  pull_request:
    paths: ['projects/rpg/**', '.github/workflows/rpg.yml', 'compose.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/rpg

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  rules:
    name: Tactical RPG, rules in C# (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rpg/global.json
      - name: Format (dotnet format)
        run: dotnet format Rpg.slnx --verify-no-changes
      # Analyzers at the recommended level, warnings are errors (Directory.Build.props).
      - name: Build
        run: dotnet build Rpg.slnx -c Release
      - name: Unit and integration tests (xUnit)
        run: |
          dotnet test --project tests/Rpg.Core.Tests -c Release --no-build
          dotnet test --project tests/Rpg.Sim.Tests -c Release --no-build
          dotnet test --project tests/Rpg.Client.Tests -c Release --no-build
      # The same record must give the same fight, roll for roll, on every system.
      - name: Replay the committed fights
        shell: bash
        run: |
          dotnet run --project src/Rpg.Sim -c Release --no-build -- --replay samples/training-7.json | tee "$RUNNER_TEMP/training.txt"
          grep -qF "Training, seed 7: team A wins in round 8, after 52 actions." "$RUNNER_TEMP/training.txt"
          dotnet run --project src/Rpg.Sim -c Release --no-build -- --replay samples/duel-3.json | tee "$RUNNER_TEMP/duel.txt"
          grep -qF "Duel, seed 3: team A wins in round 4, after 21 actions." "$RUNNER_TEMP/duel.txt"
      - name: A thousand AI fights
        run: dotnet run --project src/Rpg.Sim -c Release --no-build -- --simulate 1000 --scenario duel

  api:
    name: Accounts and characters API, ASP.NET Core and PostgreSQL
    runs-on: ubuntu-latest
    # GitHub's Windows and macOS runners cannot run Linux containers: the API is built on the three
    # systems above, and tested against PostgreSQL here.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # A throwaway database on the runner, reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      RPG_TEST_DB: Host=localhost;Username=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rpg/global.json
      # dotnet ef does not restore packages itself.
      - run: |
          dotnet tool restore
          dotnet restore Rpg.slnx
      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project src/Rpg.Api
      - name: Integration tests (WebApplicationFactory, real PostgreSQL, the game's client)
        run: dotnet test --project tests/Rpg.Api.Tests -c Release

  docker:
    name: Accounts and characters API (Docker image, compose, end to end with the game)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compose.yaml builds and serves the API and its database
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --build rpg-api
          for i in $(seq 1 60); do curl -fsS http://localhost:8002/health && break; sleep 1; done
      - name: End to end (sign up, sign in, characters, refusals, 413)
        run: scripts/smoke.sh http://localhost:8002
      # The Godot client against the same server: sign-up, a character made and chosen on the login
      # screen through its own fields and buttons, then a whole fight with that hero.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rpg/global.json
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: false
      - run: dotnet build godot/Rpg.Godot.csproj
      - run: godot --headless --path godot --import
      - name: The game's login screen against the server
        timeout-minutes: 5
        run: |
          godot --headless --path godot -- --lobby-selftest --server http://localhost:8002 --seed 9 --report "$RUNNER_TEMP/lobby.txt"
          cat "$RUNNER_TEMP/lobby.txt"
          grep -q "SELFTEST OK seed [0-9]*: .* made on server Osméria, shown on its card and chosen. Town: 3 people, 8 lines, place (15, 5) saved on the server, views checked. World: 3 zones, camera and map checked. Experience: +[0-9]* kept by the server, level [0-9]*." "$RUNNER_TEMP/lobby.txt"
      - name: API logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          docker compose logs rpg-api rpg-db
          docker compose down -v

  godot:
    name: Godot client, without a screen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rpg/global.json
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: false
      - name: Build the C# scripts
        run: dotnet build godot/Rpg.Godot.csproj
      # Through bash: PowerShell does not wait for Godot on Windows, which then skipped the import of the models.
      - name: Import the project
        shell: bash
        run: godot --headless --path godot --import
      # A whole fight through the player's controls, every event through the views, checked by replay.
      - name: A whole fight in the client
        shell: bash
        timeout-minutes: 5
        run: |
          godot --headless --path godot -- --selftest --seed 9 --report "$RUNNER_TEMP/selftest.txt"
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q "SELFTEST OK seed 9: team A wins in round 8, after 52 actions. Views checked" "$RUNNER_TEMP/selftest.txt"
      # The town first: up to every inhabitant, every line of their talk on screen, then through the gate.
      - name: The town, then the gate's fight
        shell: bash
        timeout-minutes: 5
        run: |
          godot --headless --path godot -- --town-selftest --seed 9 --report "$RUNNER_TEMP/town.txt"
          cat "$RUNNER_TEMP/town.txt"
          grep -q "SELFTEST OK seed 9: .* Town: 3 people, 8 lines, views checked. World: 3 zones, camera and map checked." "$RUNNER_TEMP/town.txt"

  exports:
    name: Godot exports (Windows, Linux, macOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: projects/rpg/global.json
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true
      - run: godot --headless --path godot --import
      - name: Export the three desktop builds
        run: |
          mkdir -p godot/build/linux godot/build/windows godot/build/macos
          for preset in Linux Windows macOS; do
            godot --headless --path godot --export-release "$preset" 2>&1 | tee -a "$RUNNER_TEMP/export.log"
          done
          # Godot exits with 0 even when it could not export the C# part: check that it is there.
          if grep -q "ERROR" "$RUNNER_TEMP/export.log"; then exit 1; fi
          # The resources apart from the executable: an update of the content downloads them alone.
          test -f godot/build/linux/rpg.pck
          test -f godot/build/windows/rpg.pck
          test -f godot/build/linux/data_Rpg.Godot_linuxbsd_x86_64/Rpg.Godot.dll
          test -f godot/build/windows/data_Rpg.Godot_windows_x86_64/Rpg.Godot.dll
          unzip -l godot/build/macos/rpg.zip | grep -q "data_Rpg.Godot_macos_arm64/Rpg.Godot.dll"
      - name: The exported Linux build plays a whole fight
        timeout-minutes: 5
        run: |
          godot/build/linux/rpg.x86_64 --headless -- --selftest --seed 9 --report "$RUNNER_TEMP/selftest.txt"
          grep -q "SELFTEST OK seed 9" "$RUNNER_TEMP/selftest.txt"
      # What the launcher downloads: each build unpacked, with its manifest (size and SHA-256 of every
      # file, which ones are executable). Written here, before the artifacts lose the file modes.
      - name: Manifests for the launcher
        run: |
          unzip -q godot/build/macos/rpg.zip -d godot/build/macos && rm godot/build/macos/rpg.zip
          for platform in linux windows macos; do
            cargo run --quiet --manifest-path launcher/Cargo.toml -p rpg-launcher-core --bin rpg-manifest -- "godot/build/$platform" "1.0.${{ github.run_number }}"
          done
          grep -q '"executable": true' godot/build/linux/manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: rpg-linux
          path: projects/rpg/godot/build/linux
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: rpg-windows
          path: projects/rpg/godot/build/windows
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: rpg-macos
          path: projects/rpg/godot/build/macos
          retention-days: 14

  launcher:
    name: Launcher, Rust and Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    defaults:
      run:
        working-directory: projects/rpg/launcher
    steps:
      - uses: actions/checkout@v7
      - name: Rust 1.90 with clippy and rustfmt
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          rustup default 1.90.0
      - name: Tauri's libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libfuse2 libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/rpg/launcher
      - name: Format (rustfmt)
        run: cargo fmt --all --check
      # Clippy at the "all" level, warnings are errors (workspace lints).
      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (cargo test)
        run: cargo test --workspace
      - name: Build and package the launcher (unsigned)
        working-directory: projects/rpg/launcher/app
        run: npx --yes @tauri-apps/cli@2.5.0 build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: rpg-launcher-${{ runner.os }}
          path: |
            projects/rpg/launcher/target/release/bundle/deb/*.deb
            projects/rpg/launcher/target/release/bundle/appimage/*.AppImage
            projects/rpg/launcher/target/release/bundle/nsis/*.exe
            projects/rpg/launcher/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  launcher-e2e:
    name: Launcher end to end (the exported game, served by compose, installed, updated, played)
    runs-on: ubuntu-latest
    needs: exports
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: rpg-linux
          path: projects/rpg/godot/build/linux
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      # The credential store (Secret Service) goes through libdbus.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/rpg/launcher
      - run: cargo build --quiet --manifest-path launcher/Cargo.toml -p rpg-launcher-core --bins
      - name: compose.yaml serves the API and the game's files
        working-directory: ${{ github.workspace }}
        run: |
          docker compose up -d --build rpg-api
          for i in $(seq 1 60); do curl -fsS http://localhost:8002/health && break; sleep 1; done
          curl -fsS http://localhost:8002/updates/linux/manifest.json | head -c 200
      - name: Install, update with nothing new, repair a damaged file
        run: |
          update() { launcher/target/debug/rpg-update http://localhost:8002 "$RUNNER_TEMP/game" linux | tee "$RUNNER_TEMP/update.txt"; }
          update && grep -qE "file\(s\) downloaded \([0-9]{6,} bytes\), 0 removed" "$RUNNER_TEMP/update.txt"
          update && grep -q "0 file(s) downloaded (0 bytes)" "$RUNNER_TEMP/update.txt"
          printf 'x' >> "$RUNNER_TEMP/game/rpg.pck"
          update && grep -q "1 file(s) downloaded" "$RUNNER_TEMP/update.txt"
      - name: The installed game plays a whole fight
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/game/rpg.x86_64" --headless -- --selftest --seed 9 --report "$RUNNER_TEMP/selftest.txt"
          grep -q "SELFTEST OK seed 9" "$RUNNER_TEMP/selftest.txt"
      - name: API logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          docker compose logs rpg-api
          docker compose down -v
