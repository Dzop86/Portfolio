name: qt

on:
  push:
    branches: [main]
    paths: ['projects/qt/**', 'projects/topologie/**', 'projects/lib-c/**', '.github/workflows/qt.yml']
  pull_request:
    paths: ['projects/qt/**', 'projects/topologie/**', 'projects/lib-c/**', '.github/workflows/qt.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Qt/OpenGL viewer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Qt 6.10.3: aqtinstall cannot read the Windows repository of Qt 6.11 (missing checksum,
      # October 2026); one version on the three systems.
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          cache: true
      - name: OpenGL and X11 libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libegl-dev libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 xvfb
      - name: Configure (warnings are errors)
        run: cmake -S projects/qt -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      # Windows runners have no graphics card: Mesa's software OpenGL (llvmpipe), placed next to the
      # programs, gives the tests an OpenGL 3.3 context. Linux uses Mesa under a virtual screen.
      - name: Mesa's software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mesa.7z" https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          7z x -y -o"$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa.7z" > /dev/null
          cp "$RUNNER_TEMP"/mesa/x64/*.dll build/Release/
      - name: Tests (Qt Test), Linux under a virtual screen
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      # On Windows, Qt would pick its own old software OpenGL (opengl32sw, OpenGL 3.0) for the
      # runner's basic display driver: "desktop" makes it load opengl32.dll, Mesa's, from the
      # programs' folder.
      - name: Tests (Qt Test)
        if: runner.os != 'Linux'
        env:
          QT_OPENGL: desktop
        run: ctest --test-dir build -C Release --output-on-failure
      - name: OpenGL diagnostics, after a failure
        if: failure()
        shell: bash
        env:
          QT_OPENGL: desktop
          QT_LOGGING_RULES: qt.qpa.gl*=true
        run: |
          if [ -f build/Release/test_render.exe ]; then test_render=build/Release/test_render.exe; else test_render=build/test_render; fi
          status=0
          "$test_render" -v2 -o "$RUNNER_TEMP/render.txt,txt" || status=$?
          echo "exit code $status"
          cat "$RUNNER_TEMP/render.txt" || true
      - name: The French translation follows the code
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target update_translations
          git diff --exit-code projects/qt/i18n
      - name: A screenshot from the command line, and a refused file
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a build/qtviewer --lang fr --curvature --screenshot "$RUNNER_TEMP/torus.png" sample:torus
          test -s "$RUNNER_TEMP/torus.png"
          echo "f 1 2 3" > "$RUNNER_TEMP/bad.obj"
          if xvfb-run -a build/qtviewer --screenshot "$RUNNER_TEMP/bad.png" "$RUNNER_TEMP/bad.obj"; then exit 1; fi
