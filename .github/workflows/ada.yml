name: ada

on:
  push:
    branches: [main]
    paths: ['projects/ada/**', '.github/workflows/ada.yml']
  pull_request:
    paths: ['projects/ada/**', '.github/workflows/ada.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ada-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ada (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Alire installs the same GNAT toolchain on the three systems.
      - uses: alire-project/setup-alire@v6
      - name: Build (warnings are errors)
        working-directory: projects/ada
        run: alr -n build
      - name: Unit tests (AUnit)
        working-directory: projects/ada/tests
        run: alr -n run
      - name: Simulation
        working-directory: projects/ada
        run: alr -n run --args="20 4"

  proof:
    name: Ada (SPARK proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: alire-project/setup-alire@v6
      # gnatprove is a dependency of the test crate only, so building the program does not download it.
      - name: Prove absence of run-time errors and the contracts
        working-directory: projects/ada/tests
        run: |
          alr -n build
          alr -n exec -- gnatprove -P ../carrefour.gpr -j0 --level=2 --checks-as-errors=on --warnings=error --report=fail
