name: fastapi

on:
  push:
    branches: [main]
    paths: ['projects/fastapi/**', 'projects/lib-c/**', '.github/workflows/fastapi.yml']
  pull_request:
    paths: ['projects/fastapi/**', 'projects/lib-c/**', '.github/workflows/fastapi.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python API (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # lib-c as a shared library, found by tests/conftest.py under projects/lib-c/build*.
      - name: Build lib-c (shared)
        run: |
          cmake -S projects/lib-c -B projects/lib-c/build-shared -DBUILD_SHARED_LIBS=ON -DMESH_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build projects/lib-c/build-shared --config Release --parallel
      - run: python -m pip install "./projects/fastapi[test]"
      - name: Test
        working-directory: projects/fastapi
        run: python -m pytest -q -W error

  docker:
    name: Python API (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f projects/fastapi/Dockerfile -t meshapi projects
      - run: projects/fastapi/scripts/smoke.sh meshapi
      - name: compose.yaml builds and serves the API
        run: |
          docker compose up -d --build api
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 1; done
          curl -fsS http://localhost:8000/health | grep -q loaded
          docker compose down
