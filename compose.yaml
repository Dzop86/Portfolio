# Global stack. Each new project adds its service here (API, database, ML...).
services:
  vitrine:
    build: .
    ports:
      - "8080:80"
  api:
    build:
      context: ./projects
      dockerfile: fastapi/Dockerfile
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
  # Roguelike score API (projects/rogue) and its database.
  rogue-api:
    build: ./projects/rogue
    ports:
      - "8001:8080"
    environment:
      ConnectionStrings__Scores: Host=rogue-db;Username=rogue;Database=rogue
      # Signing key of the access tokens: set ROGUE_JWT_KEY (base64, 32 bytes) to keep tokens across
      # restarts; left empty, the API draws a random key at start-up.
      Jwt__Key: ${ROGUE_JWT_KEY:-}
    depends_on:
      rogue-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
  rogue-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rogue
      # No password, and no published port: only the services of this file reach the database.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rogue"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - rogue-db:/var/lib/postgresql

  # Tactical RPG accounts and characters API (projects/rpg) and its database.
  rpg-api:
    build: ./projects/rpg
    ports:
      - "8002:8080"
    environment:
      ConnectionStrings__Game: Host=rpg-db;Username=rpg;Database=rpg
      # Signing key of the access tokens: set RPG_JWT_KEY (base64, 32 bytes) to keep tokens across
      # restarts; left empty, the API draws a random key at start-up.
      Jwt__Key: ${RPG_JWT_KEY:-}
      # The game's exports and their manifest.json, one folder per platform, for the launcher.
      Updates__Root: /updates
    volumes:
      - ./projects/rpg/godot/build:/updates:ro
    depends_on:
      rpg-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
  rpg-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rpg
      # No password, and no published port: only the services of this file reach the database.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rpg"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - rpg-db:/var/lib/postgresql

  # Documentation assistant API (projects/rag) and its vector database, rebuilt at each start.
  rag-api:
    build:
      context: .
      dockerfile: projects/rag/Dockerfile
    ports:
      - "8003:8000"
    environment:
      QDRANT_URL: http://rag-qdrant:6333
      # For /ask only: /search works without a key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - rag-qdrant
    # Qdrant may take a moment to listen: the API starts again until it can index.
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp
  rag-qdrant:
    image: qdrant/qdrant:v1.19.2

volumes:
  rogue-db:
  rpg-db:
