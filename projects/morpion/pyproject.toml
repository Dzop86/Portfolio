[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morpion"
version = "0.1.0"
description = "Tic-tac-toe against a minimax AI that never loses, from Charles Lepaire's portfolio"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9", "mypy>=1.18"]

[project.scripts]
morpion = "morpion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morpion = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
