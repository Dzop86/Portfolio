[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docrag"
version = "0.1.0"
description = "A documentation assistant (RAG): hybrid search over Markdown docs, answers from Claude that cite file and lines"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["qdrant-client>=1.19,<2", "anthropic>=1.13,<2", "fastapi>=0.142,<1", "uvicorn>=0.54,<1"]

[project.optional-dependencies]
# The multilingual embedding model (ONNX, no PyTorch); the tests run without it.
embed = ["fastembed>=0.9,<1"]
test = ["pytest>=9", "httpx2>=2.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
