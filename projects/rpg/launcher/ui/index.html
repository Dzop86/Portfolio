<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Osmose</title>
  <link rel="stylesheet" href="style.css">
  <script src="texts.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <header class="banner">
    <img src="banner.jpg" alt="" width="1040" height="416">
    <h1>Osmose</h1>
    <button type="button" id="lang" class="small" aria-label="Français / English"></button>
  </header>
  <main>
    <form id="form" novalidate>
      <label><span data-t="name"></span><input id="name" autocomplete="username" maxlength="20" required></label>
      <label><span data-t="password"></span><input id="password" type="password" autocomplete="current-password" maxlength="128"></label>
      <label id="confirm-row" hidden><span data-t="confirm"></span><input id="confirm" type="password" autocomplete="new-password" maxlength="128"></label>
      <label class="check"><input type="checkbox" id="remember-name"><span data-t="remember-name"></span></label>
      <label class="check"><input type="checkbox" id="remember-password"><span data-t="remember-password"></span></label>
      <button type="submit" id="submit" class="primary"></button>
      <button type="button" id="mode" class="link"></button>
    </form>
    <p id="message" role="alert"></p>
  </main>
  <footer>
    <progress id="bar" max="1" value="0"></progress>
    <p id="status" aria-live="polite"></p>
  </footer>
</body>
</html>
