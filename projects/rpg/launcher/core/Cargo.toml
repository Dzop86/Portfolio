[package]
name = "rpg-launcher-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Signs in to the tactical RPG's server, updates the game file by file, starts it."

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# The system's credential store: Windows Credential Manager, macOS Keychain, Secret Service on Linux
# (libdbus). Only the window needs it: the command-line tools build without it.
keyring = { version = "3.6.2", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
sha2 = "0.10.9"
thiserror = "2.0.12"
ureq = { version = "2.12.1", features = ["json"] }

[dev-dependencies]
tempfile = "3.20.0"
tiny_http = "0.12.0"

[lints]
workspace = true

[features]
system-secrets = ["dep:keyring"]
