[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shapeml"
version = "0.1.0"
description = "3D shape classification on synthetic meshes (Charles Lepaire's portfolio)"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.2", "pyyaml>=6"]

[project.optional-dependencies]
train = ["scikit-learn>=1.6", "torch>=2.6", "mlflow>=3.0", "onnx>=1.17", "onnxruntime>=1.20"]
test = ["pytest>=9"]
# What the API needs to serve the exported model: no PyTorch.
serve = ["onnxruntime>=1.20"]
dvc = ["dvc>=3.50"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
