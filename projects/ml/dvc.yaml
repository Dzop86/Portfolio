stages:
  generate:
    cmd: python -m shapeml.generate --params params.yaml --out data/shapes.npz
    deps:
      - src/shapeml/shapes.py
      - src/shapeml/dataset.py
      - src/shapeml/generate.py
    params:
      - generate
    outs:
      - data/shapes.npz
  train:
    cmd: python -m shapeml.train --params params.yaml --data data/shapes.npz
    deps:
      - data/shapes.npz
      - src/shapeml/features.py
      - src/shapeml/pointnet.py
      - src/shapeml/train.py
    params:
      - train
    outs:
      - models
      - confusion.json:
          cache: false
    metrics:
      - metrics.json:
          cache: false
  export:
    cmd: python -m shapeml.export --params params.yaml --data data/shapes.npz --model models/pointnet.pt --out export/pointnet.onnx
    deps:
      - data/shapes.npz
      - models
      - src/shapeml/export.py
      - src/shapeml/infer.py
      - src/shapeml/pointnet.py
    params:
      - generate.points
    outs:
      # Small (a few hundred KB) and served by the API: kept in git, not in the DVC cache.
      - export/pointnet.onnx:
          cache: false
      - export/pointnet.json:
          cache: false
  check:
    cmd: python -m shapeml.check --metrics metrics.json --params params.yaml --export export/pointnet.json
    deps:
      - metrics.json
      - export/pointnet.json
    params:
      - check
